[project]
name = "cvr-adresse-checker"
version = "0.1.0"
description = "Finder virksomheder med reelt skift af beliggenhedsadresse inden for 3 måneder (cvr.dev)"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cvr-adresse-checker = "cvr_adresse_checker.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cvr_adresse_checker"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["cvr_adresse_checker", "tests"]
